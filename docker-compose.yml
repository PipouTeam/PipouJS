services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pipou_db
      POSTGRES_USER: pipou
      POSTGRES_PASSWORD: pipou_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pipou_db
      DB_USER: pipou
      DB_PASSWORD: pipou_secret
      PORT: 3001
      SECRET: change_me_in_production
      FRONTEND_URL: http://localhost:3000
      BACKOFFICE_URL: http://localhost:3002
      S3_ENDPOINT: http://minio:9000            # Réseau interne docker
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pipou-resources
    depends_on:
      - postgres

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data

  # Crée le bucket + seed les fichiers de démo au démarrage
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      - ./database/seed-s3.sh:/seed-s3.sh
      - ./database/seed-images:/seed-images
    entrypoint: /bin/sh /seed-s3.sh

  # ── Frontends (profils full-local / front-only) ───────────────────

  pipou-ressource:
    image: node:20-alpine
    profiles: ["full-local", "front-only"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/pipou-ressource:/app
      - pipou_ressource_node_modules:/app/node_modules
    env_file:
      - ./frontend/pipou-ressource/.env

  backoffice:
    image: node:20-alpine
    profiles: ["full-local", "front-only"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3002:3002"
    volumes:
      - ./frontend/backoffice:/app
      - backoffice_node_modules:/app/node_modules
    env_file:
      - ./frontend/backoffice/.env

volumes:
  postgres_data:
  minio_data:
  pipou_ressource_node_modules:
  backoffice_node_modules:
