services:
  postgres-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: pipou_db
      POSTGRES_USER: pipou
      POSTGRES_PASSWORD: pipou_secret
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipou -d pipou_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio-init-test:
    image: minio/mc
    restart: "no"
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio-test:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/pipou-resources &&
        mc anonymous set download local/pipou-resources
      "
