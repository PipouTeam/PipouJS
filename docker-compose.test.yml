services:
  postgres-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: pipou_db
      POSTGRES_USER: pipou
      POSTGRES_PASSWORD: pipou_secret
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipou -d pipou_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 10

  minio-init-test:
    image: minio/mc
    restart: "no"
    depends_on:
      minio-test:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio-test:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/pipou-resources &&
        mc anonymous set download local/pipou-resources
      "

  # ── Services E2E ─────────────────────────────────────────────────
  backend-test:
    build: ./backend
    profiles: ["e2e"]
    restart: "no"
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-init-test:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_DATABASE: pipou_db
      DB_USER: pipou
      DB_PASSWORD: pipou_secret
      PORT: 3001
      SECRET: test_secret
      FRONTEND_URL: http://localhost:3000
      BACKOFFICE_URL: http://localhost:3002
      S3_ENDPOINT: http://minio-test:9000
      S3_PUBLIC_URL: http://localhost:9100
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pipou-resources
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/stats >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  frontend-test:
    image: node:20-alpine
    profiles: ["e2e"]
    working_dir: /app
    command: sh -c "npm ci && npm run build && npx -y serve -s dist -l 3000"
    depends_on:
      backend-test:
        condition: service_healthy
    volumes:
      - ./frontend/pipou-ressource:/app
      - frontend_test_nm:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  backoffice-test:
    image: node:20-alpine
    profiles: ["e2e"]
    working_dir: /app
    command: sh -c "npm ci && npm run build && npx -y serve -s dist -l 3002"
    depends_on:
      backend-test:
        condition: service_healthy
    volumes:
      - ./frontend/backoffice:/app
      - backoffice_test_nm:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:3001/
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  frontend_test_nm:
  backoffice_test_nm:
