name: Docker Build

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  build-backend:
    name: Build image Docker backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
