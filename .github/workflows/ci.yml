name: CI

on:
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  # ── Build ────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts

  build-frontend-app:
    name: Build Frontend (pipou-ressource)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pipou-ressource
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/pipou-ressource/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

  build-frontend-backoffice:
    name: Build Frontend (backoffice)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/backoffice/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

  # ── Tests unitaires ──────────────────────────────────────────────
  test-backend-unit:
    name: Tests unitaires Backend
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
      - name: Rapport de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats — Backend Unit
          path: backend/test-results/junit.xml
          reporter: jest-junit

  test-frontend-unit-app:
    name: Tests unitaires Frontend (pipou-ressource)
    runs-on: ubuntu-latest
    needs: build-frontend-app
    defaults:
      run:
        working-directory: frontend/pipou-ressource
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/pipou-ressource/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          CI: true
      - name: Rapport de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats — Frontend App
          path: frontend/pipou-ressource/test-results/junit.xml
          reporter: jest-junit

  test-frontend-unit-backoffice:
    name: Tests unitaires Frontend (backoffice)
    runs-on: ubuntu-latest
    needs: build-frontend-backoffice
    defaults:
      run:
        working-directory: frontend/backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/backoffice/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          CI: true
      - name: Rapport de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats — Frontend Backoffice
          path: frontend/backoffice/test-results/junit.xml
          reporter: jest-junit

  # ── Tests d'intégration ──────────────────────────────────────────
  test-backend-integration:
    name: Tests intégration Backend
    runs-on: ubuntu-latest
    needs: build-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipou_db
          POSTGRES_USER: pipou
          POSTGRES_PASSWORD: pipou_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipou -d pipou_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: fclairamb/minio-github-actions:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Configurer MinIO (créer le bucket)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
          /tmp/mc mb --ignore-existing local/pipou-resources
          /tmp/mc anonymous set download local/pipou-resources

      - name: Lancer les tests d'intégration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: pipou
          DB_PASSWORD: pipou_secret
          DB_DATABASE: pipou_db
          SECRET: test_secret
          PORT: "0"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_PUBLIC_URL: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: pipou-resources
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
        run: npm run test:integration:ci

      - name: Rapport de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Résultats — Backend Intégration
          path: backend/test-results/junit.xml
          reporter: jest-junit

  # ── Tests de performance ──────────────────────────────────────────
  test-performance:
    name: Tests de performance (k6 smoke)
    runs-on: ubuntu-latest
    needs: [build-backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipou_db
          POSTGRES_USER: pipou
          POSTGRES_PASSWORD: pipou_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipou -d pipou_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: fclairamb/minio-github-actions:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Configurer MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
          /tmp/mc mb --ignore-existing local/pipou-resources
          /tmp/mc anonymous set download local/pipou-resources

      - name: Initialiser la base de données
        run: |
          apt-get update -qq && apt-get install -yqq postgresql-client > /dev/null 2>&1 || true
          PGPASSWORD=pipou_secret psql -h 127.0.0.1 -U pipou -d pipou_db -f database/schema.sql

      - name: Installer k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.56.0/k6-v0.56.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.56.0-linux-amd64/k6 /usr/local/bin/

      - name: Démarrer le backend et lancer le smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pipou_db
          DB_USER: pipou
          DB_PASSWORD: pipou_secret
          PORT: 3001
          SECRET: test_secret
          FRONTEND_URL: http://localhost:3000
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_PUBLIC_URL: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: pipou-resources
        run: |
          cd backend && npm ci --ignore-scripts
          node src/server.js &
          cd ..
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/api/stats && break
            sleep 2
          done
          k6 run perf/scripts/smoke.js -e BASE_URL=http://127.0.0.1:3001

  # ── Notification d'échec ─────────────────────────────────────────
  notify-failure:
    name: Créer une issue en cas d'échec
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend-app
      - build-frontend-backoffice
      - test-backend-unit
      - test-frontend-unit-app
      - test-frontend-unit-backoffice
      - test-backend-integration
      - test-performance
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const branch = pr ? pr.head.ref : context.ref.replace('refs/heads/', '')
            const sha = context.sha.substring(0, 7)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const prLink = pr ? `[PR #${pr.number} — ${pr.title}](${pr.html_url})` : 'Push direct'

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI échouée — ${branch} (${sha})`,
              labels: ['bug'],
              body: [
                '## CI en échec',
                '',
                `**PR :** ${prLink}`,
                `**Branche :** \`${branch}\``,
                `**Commit :** \`${sha}\``,
                `**Logs :** [Voir le workflow](${runUrl})`,
              ].join('\n')
            })
