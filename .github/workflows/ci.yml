name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ── Build ────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

  build-frontend-app:
    name: Build Frontend (pipou-ressource)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pipou-ressource
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/pipou-ressource/package-lock.json
      - run: npm ci
      - run: npm run build

  build-frontend-backoffice:
    name: Build Frontend (backoffice)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/backoffice/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Tests unitaires ──────────────────────────────────────────────
  test-backend-unit:
    name: Tests unitaires Backend
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Placeholder : sera activé quand les tests frontend seront en place
  # test-frontend-unit:
  #   name: Tests unitaires Frontend
  #   runs-on: ubuntu-latest
  #   needs: [build-frontend-app, build-frontend-backoffice]
  #   steps: ...

  # ── Tests d'intégration ──────────────────────────────────────────
  test-backend-integration:
    name: Tests intégration Backend
    runs-on: ubuntu-latest
    needs: build-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipou_db
          POSTGRES_USER: pipou
          POSTGRES_PASSWORD: pipou_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipou -d pipou_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Démarrer MinIO et créer le bucket
      - name: Configurer MinIO (créer le bucket)
        run: |
          # Attendre que MinIO soit prêt
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          # Installer mc et créer le bucket
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
          /tmp/mc mb --ignore-existing local/pipou-resources
          /tmp/mc anonymous set download local/pipou-resources

      - name: Lancer les tests d'intégration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: pipou
          DB_PASSWORD: pipou_secret
          DB_DATABASE: pipou_db
          SECRET: test_secret
          PORT: "0"
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_PUBLIC_URL: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: pipou-resources
        run: npm run test:integration

  # Placeholder : sera activé quand les tests seront en place
  # test-e2e:
  #   name: Tests E2E
  #   ...
  # test-performance:
  #   name: Tests de performance
  #   ...
